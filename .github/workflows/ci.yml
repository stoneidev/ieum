name: CI

on:
  push:
    branches: [main]
  pull_request:

# CaptionCore needs the macOS 26 SDK (FoundationModels). macos-15 fails to import it.
# OverlayApp is not built here: Xcode 26.6's Swift frontend crashes with
# "SmallVector unable to grow" while IR-generating SettingsView.swift on the
# GitHub runner. CaptionCoreTests only depends on CaptionCore, so unit tests
# stay green without that executable. Full `make app` remains a local Mac check.
permissions:
  contents: read

jobs:
  test:
    name: CaptionCoreTests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Show Swift / SDK
        run: |
          swift --version
          xcrun --sdk macosx --show-sdk-version

      - name: Build CaptionCoreTests
        run: swift build --build-tests --target CaptionCoreTests

      - name: Run CaptionCoreTests
        run: swift test --skip-build

      - name: Release build CaptionCore
        run: swift build -c release --arch arm64 --target CaptionCore
