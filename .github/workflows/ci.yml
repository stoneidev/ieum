name: CI

on:
  push:
    branches: [main]
  pull_request:

# CaptionCore links Apple frameworks (Speech, AVFoundation, FoundationModels, …).
# FoundationModels needs the macOS 26 SDK (Xcode 26); macos-15 runners fail to import it.
permissions:
  contents: read

jobs:
  test:
    name: swift test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Show Swift / SDK
        run: |
          swift --version
          xcrun --sdk macosx --show-sdk-version

      - name: Run package tests
        run: swift test

      - name: Release build (warning check)
        run: swift build -c release --arch arm64
